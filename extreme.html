<!DOCTYPE html>
<html>
<head>
  <title>Extreme Level</title>
  <style>
    body { text-align:center; font-family:Arial; background:#cce5ff; }
    button { padding:10px; margin:10px; }
  </style>
</head>
<body>

<h1>🔵 Extreme Level</h1>

<p id="task">Click Start</p>
<p id="timer"></p>

<button onclick="startTask()">Start</button>

<script>
const tasks = [
"Explain dengue prevention in 10 seconds",
"Act and explain symptoms quickly",
"Give 3 prevention methods fast",
"Create a slogan in 5 seconds",
"Act like a doctor and explain dengue"
];

let time;

function startTask(){
  const r = Math.floor(Math.random()*tasks.length);
  document.getElementById("task").innerText = tasks[r];

  let seconds = 10;
  document.getElementById("timer").innerText = "Time: " + seconds;

  clearInterval(time);

  time = setInterval(()=>{
    seconds--;
    document.getElementById("timer").innerText = "Time: " + seconds;

    if(seconds <= 0){
      clearInterval(time);
      document.getElementById("timer").innerText = "⏰ Time's up!";
    }
  },1000);
}
</script>

</body>
</html>

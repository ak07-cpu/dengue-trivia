<!DOCTYPE html>
<html>
<head>
<title>Dengue Slayer</title>

<style>
body{
font-family:Arial;
text-align:center;
background:linear-gradient(to right,#36d1dc,#5b86e5);
padding:40px;
color:white;
}

.box{
background:rgba(0,0,0,0.3);
padding:25px;
border-radius:20px;
display:inline-block;
}

input{
padding:10px;
margin:8px;
width:220px;
border:none;
border-radius:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}
</style>
</head>

<body>

<div class="box">

<h1>🦟 Dengue Slayer Monopoly</h1>

<input id="p1" placeholder="Player 1"><br>
<input id="p2" placeholder="Player 2"><br>
<input id="p3" placeholder="Player 3"><br>
<input id="p4" placeholder="Player 4"><br>

<button onclick="startGame()">START GAME</button>

</div>

<script>
function startGame(){

localStorage.setItem("p1",document.getElementById("p1").value || "Player 1");
localStorage.setItem("p2",document.getElementById("p2").value || "Player 2");
localStorage.setItem("p3",document.getElementById("p3").value || "Player 3");
localStorage.setItem("p4",document.getElementById("p4").value || "Player 4");

window.location.href="game.html";

}
</script>

</body>
</html>

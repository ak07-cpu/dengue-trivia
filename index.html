<!DOCTYPE html>
<html>
<head>
  <title>Easy Level</title>
  <style>
    body { text-align:center; font-family:Arial; background:#d4edda; }
    button { padding:10px; margin:10px; }
  </style>
</head>
<body>

<h1>🟢 Easy Level</h1>
<p id="task">Click Next</p>

<button onclick="nextTask()">Next Task</button>

<script>
const tasks = [
"Name one symptom of Dengue Fever",
"Show with your hands how a mosquito flies",
"Say one way to prevent mosquito bites",
"Clap 5 times and say 'Stop Aedes!'",
"Act like you are applying mosquito repellent",
"Point to something in the room that can hold water",
"Say True or False: Aedes bites at night",
"Spell the word 'DENGUE'",
"Name one place at home where water can collect",
"Say the slogan: 'No water, no Aedes!'"
];

function nextTask(){
  const r = Math.floor(Math.random()*tasks.length);
  document.getElementById("task").innerText = tasks[r];
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Dengue Slayer Setup</title>
<style>
body{
font-family:Arial;
text-align:center;
background:linear-gradient(to right,#36d1dc,#5b86e5);
color:white;
padding:40px;
}
.box{
background:rgba(0,0,0,0.3);
padding:20px;
border-radius:15px;
display:inline-block;
}
input{padding:8px;margin:5px;}
button{padding:10px 20px;}
</style>
</head>

<body>

<div class="box">
<h1>🦟 Dengue Slayer</h1>

<input id="p1" placeholder="Player 1"><br>
<input id="p2" placeholder="Player 2"><br>
<input id="p3" placeholder="Player 3"><br>
<input id="p4" placeholder="Player 4"><br>

<button onclick="start()">Start Game</button>
</div>

<script>
function start(){
localStorage.setItem("p1",p1.value);
localStorage.setItem("p2",p2.value);
localStorage.setItem("p3",p3.value);
localStorage.setItem("p4",p4.value);
window.location="game.html";
}
</script>

</body>
</html>

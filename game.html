<!DOCTYPE html>
<html>
<head>
  <title>Dengue Slayer Game</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f4f4f4;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 50px);
      gap: 5px;
      justify-content: center;
      margin-top: 20px;
    }

    .box {
      width: 50px;
      height: 50px;
      border: 1px solid black;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .green { background: #a8e6a1; }
    .yellow { background: #fff59d; }
    .red { background: #ef9a9a; }
    .blue { background: #90caf9; }

    button {
      margin: 5px;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>🧟 Dengue Slayer Monopoly</h2>

<h3>Player: <span id="player"></span></h3>

<button onclick="rollDice()">🎲 Roll Dice</button>
<p>Dice: <span id="dice">0</span></p>

<p id="question"></p>
<div id="options"></div>

<p>⏱ Time: <span id="time">10</span></p>
<p>🎯 Score: <span id="score">0</span> / 300</p>

<h3>📍 Board</h3>
<div id="board"></div>

<script>
let score = 0;
let timer;
let currentQ;

// PLAYER
document.getElementById("player").innerText =
localStorage.getItem("player");

// BOARD (32 boxes)
const board = document.getElementById("board");

const colors = [
"green","green","green","green",
"yellow","yellow","yellow","yellow",
"red","red","red","red",
"blue","blue","blue","blue",
"green","yellow","red","blue"
];

for(let i=0;i<32;i++){
  let div = document.createElement("div");
  div.className = "box " + colors[i];
  div.innerText = i+1;
  board.appendChild(div);
}

// QUESTIONS (sample - you can expand to 32 later)
const questions = [
{
q:"What causes dengue?",
o:["Virus","Bacteria","Fungus","Algae"],
a:0
},
{
q:"When do Aedes bite?",
o:["Night","Day","Evening","Midnight"],
a:1
},
{
q:"Where do mosquitoes breed?",
o:["Clean water","Fire","Air","Sand"],
a:0
},
{
q:"Which mosquito spreads dengue?",
o:["Aedes aegypti","Culex","Housefly","Ant"],
a:0
}
];

// 🎲 DICE
function rollDice(){
  document.getElementById("dice").innerText =
  Math.floor(Math.random()*6)+1;

  loadQuestion();
}

// ❓ QUESTION
function loadQuestion(){
  currentQ = questions[Math.floor(Math.random()*questions.length)];

  document.getElementById("question").innerText = currentQ.q;

  let div = document.getElementById("options");
  div.innerHTML = "";

  currentQ.o.forEach((opt,i)=>{
    let btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = ()=>check(i);
    div.appendChild(btn);
  });

  startTimer();
}

// ✅ CHECK ANSWER
function check(i){
  clearInterval(timer);

  if(i === currentQ.a){
    score += 10;
    document.getElementById("question").innerText = "✅ Correct!";
  } else {
    document.getElementById("question").innerText = "❌ Wrong! Do task!";
  }

  document.getElementById("score").innerText = score;
}

// ⏱ TIMER
function startTimer(){
  let t = 10;
  document.getElementById("time").innerText = t;

  clearInterval(timer);

  timer = setInterval(()=>{
    t--;
    document.getElementById("time").innerText = t;

    if(t <= 0){
      clearInterval(timer);
      document.getElementById("question").innerText = "⏰ Time up!";
    }
  },1000);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Dengue Slayer Game</title>

<style>
body{font-family:Arial;text-align:center;}

#board{
display:grid;
grid-template-columns:repeat(10,50px);
gap:5px;
justify-content:center;
margin-top:20px;
position:relative;
}

.box{
width:50px;height:50px;
border:1px solid black;
font-size:10px;
display:flex;
align-items:center;
justify-content:center;
}

.green{background:#a8e6a1;}
.yellow{background:#fff59d;}
.red{background:#ef9a9a;}
.blue{background:#90caf9;}

#token{
width:20px;height:20px;
background:red;
border-radius:50%;
position:absolute;
transition:0.3s;
}
</style>
</head>

<body>

<h2>🦟 Dengue Slayer Monopoly</h2>

<h3>Player: <span id="player"></span></h3>
<h3>Turn: <span id="turn"></span></h3>

<button onclick="rollDice()">🎲 Roll Dice</button>
<p>Dice: <span id="dice">0</span></p>

<p id="question"></p>
<div id="options"></div>

<p>⏱ Time: <span id="time">0</span></p>
<p>🎯 Score: <span id="score">0</span> / 300</p>

<h3>🏆 Leaderboard</h3>
<div id="leaderboard"></div>

<div id="board"></div>
<div id="token"></div>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Dengue Slayer</title>

<style>
body{font-family:Arial;text-align:center;}

#board{
width:420px;height:420px;
margin:20px auto;
position:relative;
}

.box{
width:40px;height:40px;
border:1px solid black;
position:absolute;
font-size:7px;
display:flex;
align-items:center;
justify-content:center;
}

.green{background:#a8e6a1;}
.yellow{background:#fff59d;}
.red{background:#ef9a9a;}
.blue{background:#90caf9;}

.active{outline:3px solid black;}

.glow{animation:glow 0.5s alternate 3;}
@keyframes glow{
from{box-shadow:0 0 5px yellow;}
to{box-shadow:0 0 20px orange;}
}

.token{
width:12px;height:12px;
border-radius:50%;
position:absolute;
transition:0.3s;
}
.p1{background:red;}
.p2{background:blue;}
.p3{background:green;}
.p4{background:purple;}

</style>
</head>

<body>

<h2>🦟 Dengue Slayer Monopoly</h2>
<h3>Turn: <span id="turn"></span></h3>

<button onclick="rollDice()">🎲 Roll Dice</button>
<p>Dice: <span id="dice">0</span></p>

<p id="question"></p>
<div id="options"></div>

<p>⏱ <span id="time"></span></p>
<p>Score: <span id="score">0</span>/300</p>

<h3>🏆 Leaderboard</h3>
<div id="leaderboard"></div>

<div id="board"></div>

<script>

// PLAYERS
const players=[
{name:"P1",pos:0,score:0,skip:false},
{name:"P2",pos:0,score:0,skip:false},
{name:"P3",pos:0,score:0,skip:false},
{name:"P4",pos:0,score:0,skip:false}
];

let turn=0;
let timer,currentQ;

function showTurn(){
document.getElementById("turn").innerText=players[turn].name;
}
showTurn();

// BOARD
const board=document.getElementById("board");
let boxes=[];

for(let i=0;i<40;i++){
let div=document.createElement("div");

if(i<10) div.className="box green";
else if(i<20) div.className="box yellow";
else if(i<30) div.className="box red";
else div.className="box blue";

board.appendChild(div);
boxes.push(div);
}

// POSITION (SQUARE)
let size=40,gap=2;

// bottom
for(let i=0;i<10;i++){
boxes[i].style.left=(i*(size+gap))+"px";
boxes[i].style.top="380px";
}

// right
for(let i=10;i<20;i++){
boxes[i].style.left="380px";
boxes[i].style.top=(380-(i-10)*(size+gap))+"px";
}

// top
for(let i=20;i<30;i++){
boxes[i].style.left=(380-(i-20)*(size+gap))+"px";
boxes[i].style.top="0px";
}

// left
for(let i=30;i<40;i++){
boxes[i].style.left="0px";
boxes[i].style.top=((i-30)*(size+gap))+"px";
}

// CORNERS
boxes[0].innerText="START";
boxes[9].innerText="HOSPITAL";
boxes[19].innerText="FOGGING";
boxes[29].innerText="GO HOSP";

// TOKENS
const tokens=[];
["p1","p2","p3","p4"].forEach(c=>{
let t=document.createElement("div");
t.className="token "+c;
board.appendChild(t);
tokens.push(t);
});

function moveToken(i){
let p=players[i];
let rect=boxes[p.pos].getBoundingClientRect();
let bRect=board.getBoundingClientRect();

tokens[i].style.left=(rect.left-bRect.left+10)+"px";
tokens[i].style.top=(rect.top-bRect.top+10)+"px";
}

players.forEach((p,i)=>moveToken(i));

// 🎲 DICE
function rollDice(){
let d=document.getElementById("dice");
let c=0;

let roll=setInterval(()=>{
d.innerText=Math.floor(Math.random()*6)+1;
c++;
if(c>10){
clearInterval(roll);
let final=Math.floor(Math.random()*6)+1;
d.innerText=final;
animateMove(final);
}
},100);
}

// MOVE
function animateMove(step){
let i=0;
let p=players[turn];

let mv=setInterval(()=>{
if(i>=step){
clearInterval(mv);
checkSpecial(p);
loadQuestion(p);
return;
}

p.pos++;
if(p.pos>=40)p.pos=0;

moveToken(turn);
highlight(p.pos);

i++;
},300);
}

// HIGHLIGHT
function highlight(pos){
boxes.forEach(b=>b.classList.remove("active","glow"));
boxes[pos].classList.add("active","glow");
}

// SPECIAL
function checkSpecial(p){
if(p.pos===9){alert("🏥 Skip turn");p.skip=true;}
if(p.pos===19){alert("💨 Move +2");p.pos+=2;}
if(p.pos===29){alert("🚑 Go Hospital");p.pos=9;}
}

// QUESTIONS (FULL SET)

const easy=[
{q:"What disease is spread by Aedes mosquitoes?",o:["Malaria","Dengue Fever","Flu","COVID-19"],a:1},
{q:"What mosquito spreads dengue?",o:["Culex","Anopheles","Aedes aegypti","Housefly"],a:2},
{q:"When do Aedes mosquitoes bite?",o:["Night","Day","Midnight only","Rain only"],a:1},
{q:"Where do they lay eggs?",o:["Dirty drains","Clean stagnant water","Soil","Air"],a:1},
{q:"Life cycle duration?",o:["1 day","3 days","7–10 days","1 month"],a:2},
{q:"Aedes breed in dirty water",o:["True","False"],a:1},
{q:"Common symptom?",o:["Fever","Hair loss","Toothache","Sneezing"],a:0},
{q:"Which mosquito bites?",o:["Male","Female"],a:1}
];

const medium=[
{q:"Breeding place?",o:["Flower pot","Pillow","Book","Shoe"],a:0},
{q:"Gas that attracts mosquitoes?",o:["Oxygen","Nitrogen","CO2","Hydrogen"],a:2},
{q:"Why weekly cleaning?",o:["Saves water","Stops life cycle","For fun","No reason"],a:1},
{q:"If untreated?",o:["Nothing","Gets stronger","Can be fatal","Sleepy"],a:2},
{q:"High-risk season?",o:["Dry","Rainy","Winter","Snow"],a:1},
{q:"Prevention method?",o:["Eat candy","Repellent","Sleep late","Ignore"],a:1},
{q:"Aedes appearance?",o:["Plain brown","Black white stripes","Green","Transparent"],a:1},
{q:"Bottle cap water enough?",o:["Yes","No"],a:0}
];

const hard=[
{q:"Why clean water?",o:["More predators","Safer for larvae","Hotter","Brighter"],a:1},
{q:"Why hard to control?",o:["Slow breeding","Fast breeding & hidden spots","Big size","Weak"],a:1},
{q:"Bottle trap works by?",o:["Heat","CO2 attraction","Sound","Light"],a:1},
{q:"Why daytime biting?",o:["Body clock","Cold","Dark","Noise"],a:0},
{q:"Why community needed?",o:["One person enough","Everyone affected","No reason","For fun"],a:1},
{q:"If ignored?",o:["No change","More cases","Less mosquitoes","Safer"],a:1},
{q:"Urban risk?",o:["Less water","More containers","Cold weather","Fewer people"],a:1},
{q:"Fogging not long-term?",o:["Kills forever","Temporary only","Free","Strong"],a:1}
];

const extreme=[
{q:"Transmission cycle?",o:["Animals","Humans multiply virus","No infection","Mosquito no bite"],a:1},
{q:"Urban survival?",o:["Less food","More predators","More containers","Cool weather"],a:2},
{q:"Fogging limitation?",o:["Expensive","Temporary kill","Attracts","No smoke"],a:1},
{q:"Larvae removal?",o:["Bigger","Stops reproduction","Fly faster","Harmless"],a:1},
{q:"CO2 role?",o:["Color","Signal breathing","Noise","Heat"],a:1},
{q:"Community role?",o:["One house","Enough","Travel houses","Not serious"],a:2},
{q:"Egg survival?",o:["Die","Waterproof","Fly","Instant"],a:1},
{q:"Behavior challenge?",o:["Water","Forget","Big mosquito","Cold"],a:1}
];

// LOAD QUESTION
function loadQuestion(p){
let lvl,time;

if(p.pos<10){lvl=easy;time=10;}
else if(p.pos<20){lvl=medium;time=15;}
else if(p.pos<30){lvl=hard;time=20;}
else{lvl=extreme;time=25;}

currentQ=lvl[Math.floor(Math.random()*lvl.length)];

document.getElementById("question").innerText=currentQ.q;

let div=document.getElementById("options");
div.innerHTML="";

currentQ.o.forEach((opt,i)=>{
let b=document.createElement("button");
b.innerText=opt;
b.onclick=()=>checkAnswer(i,p);
div.appendChild(b);
});

startTimer(time);
}

// CHECK
function checkAnswer(choice,p){
clearInterval(timer);

if(choice===currentQ.a){
p.score+=10;
alert("✅ Correct");
}else{
alert("❌ Wrong → Do task");
}

document.getElementById("score").innerText=p.score;

updateLeaderboard();
nextTurn();
}

// TIMER
function startTimer(t){
document.getElementById("time").innerText=t;

clearInterval(timer);

timer=setInterval(()=>{
t--;
document.getElementById("time").innerText=t;

if(t<=0){
clearInterval(timer);
alert("⏰ Time up!");
nextTurn();
}
},1000);
}

// TURN
function nextTurn(){
turn++;
if(turn>=players.length)turn=0;

if(players[turn].skip){
alert(players[turn].name+" skipped!");
players[turn].skip=false;
turn++;
if(turn>=players.length)turn=0;
}

showTurn();
}

// LEADERBOARD
function updateLeaderboard(){
let board=document.getElementById("leaderboard");
let sorted=[...players].sort((a,b)=>b.score-a.score);

board.innerHTML="";
sorted.forEach(p=>{
let d=document.createElement("div");
d.innerText=p.name+" : "+p.score;
board.appendChild(d);
});
}

</script>
</body>
</html>

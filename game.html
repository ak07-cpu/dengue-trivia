<!DOCTYPE html>
<html>
<head>
<title>Dengue Slayer Game</title>
<style>
body{
  font-family:Arial;
  text-align:center;
  background:#f4f4f4;
}

button{
  padding:8px 12px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

#board{
  width:420px;
  height:420px;
  margin:20px auto;
  position:relative;
  border:2px solid black;
  background:white;
}

.box{
  width:40px;
  height:40px;
  border:1px solid black;
  position:absolute;
  font-size:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.corner{
  background:white;
  font-weight:bold;
}

.easy{background:#a8e6a1;}
.medium{background:#fff59d;}
.hard{background:#ef9a9a;}
.extreme{background:#90caf9;}

#center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:22px;
  font-weight:bold;
}

.token{
  width:12px;
  height:12px;
  border-radius:50%;
  position:absolute;
  transition:0.25s;
  z-index:10;
}

.p1{background:red;}
.p2{background:blue;}
.p3{background:green;}
.p4{background:purple;}

.active{
  outline:3px solid black;
  box-shadow:0 0 15px orange;
}

#win{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  color:white;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#winBox{
  background:white;
  color:black;
  padding:35px;
  border-radius:20px;
}

#question{
  font-weight:bold;
  font-size:18px;
}

#taskBox{
  font-weight:bold;
  color:#b00020;
}
</style>
</head>

<body>

<h2>🦟 Dengue Slayer Monopoly</h2>
<h3>Turn: <span id="turn"></span></h3>

<button onclick="rollDice()">🎲 Roll Dice</button>
<p>Dice: <span id="dice">0</span></p>

<p id="question"></p>
<div id="options"></div>

<p>⏱ Time: <span id="time">0</span></p>
<p>Score: <span id="score">0</span> / 300</p>
<p id="taskBox"></p>

<div id="board">
  <div id="center">DENGUE<br>TRIVIA</div>
</div>

<div id="win">
  <div id="winBox">
    <h1>🏆 WINNER</h1>
    <h2 id="winner"></h2>
    <button onclick="location.href='index.html'">Play Again</button>
  </div>
</div>

<script>
let players = [
  {name:localStorage.getItem("p1") || "Player 1", pos:0, score:0, skip:false},
  {name:localStorage.getItem("p2") || "Player 2", pos:0, score:0, skip:false},
  {name:localStorage.getItem("p3") || "Player 3", pos:0, score:0, skip:false},
  {name:localStorage.getItem("p4") || "Player 4", pos:0, score:0, skip:false}
];

let turn = 0;
let timer;
let currentQ;
let isProcessing = false;

const board = document.getElementById("board");
let boxes = [];

/* CREATE 40 BOXES */
for(let i=0;i<40;i++){
  let box = document.createElement("div");

  if(i===0 || i===9 || i===19 || i===29){
    box.className = "box corner";
  } else if(i < 10){
    box.className = "box easy";
  } else if(i < 20){
    box.className = "box medium";
  } else if(i < 30){
    box.className = "box hard";
  } else {
    box.className = "box extreme";
  }

  board.appendChild(box);
  boxes.push(box);
}

/* CORNER LABELS */
boxes[0].innerText = "START";
boxes[9].innerText = "HOSPITAL";
boxes[19].innerText = "DENGUE FOGGING";
boxes[29].innerText = "GO TO HOSPITAL";

/* RIGHT TO LEFT ROTATION */
let size = 40;
let gap = 2;

/* bottom row: right to left */
for(let i=0;i<10;i++){
  boxes[i].style.left = (360 - i * (size + gap)) + "px";
  boxes[i].style.top = "380px";
}

/* left side: bottom to top */
for(let i=10;i<20;i++){
  boxes[i].style.left = "0px";
  boxes[i].style.top = (380 - (i - 10) * (size + gap)) + "px";
}

/* top row: left to right */
for(let i=20;i<30;i++){
  boxes[i].style.left = ((i - 20) * (size + gap)) + "px";
  boxes[i].style.top = "0px";
}

/* right side: top to bottom */
for(let i=30;i<40;i++){
  boxes[i].style.left = "380px";
  boxes[i].style.top = ((i - 30) * (size + gap)) + "px";
}

/* TOKENS */
let tokens = [];
["p1","p2","p3","p4"].forEach(c=>{
  let token = document.createElement("div");
  token.className = "token " + c;
  board.appendChild(token);
  tokens.push(token);
});

function moveToken(i){
  let p = players[i];
  let rect = boxes[p.pos].getBoundingClientRect();
  let boardRect = board.getBoundingClientRect();

  tokens[i].style.left = (rect.left - boardRect.left + 10) + "px";
  tokens[i].style.top = (rect.top - boardRect.top + 10) + "px";
}

function highlightBox(pos){
  boxes.forEach(b=>b.classList.remove("active"));
  boxes[pos].classList.add("active");
}

players.forEach((p,i)=>moveToken(i));

/* 40 QUESTIONS — EACH BOX HAS ONE QUESTION */
const Q = [
  {q:"START BOX: Roll the dice to begin.",o:["Start"],a:0,level:"easy"},

  {q:"What disease is spread by Aedes mosquitoes?",o:["Malaria","Dengue Fever","Flu","COVID-19"],a:1,level:"easy"},
  {q:"What mosquito spreads dengue?",o:["Culex","Anopheles","Aedes aegypti","Housefly"],a:2,level:"easy"},
  {q:"When do Aedes mosquitoes bite?",o:["Night","Day","Midnight only","Rain only"],a:1,level:"easy"},
  {q:"Where do they lay eggs?",o:["Dirty drains","Clean stagnant water","Soil","Air"],a:1,level:"easy"},
  {q:"Life cycle duration?",o:["1 day","3 days","7–10 days","1 month"],a:2,level:"easy"},
  {q:"Aedes breed in dirty water.",o:["True","False"],a:1,level:"easy"},
  {q:"Common dengue symptom?",o:["Fever","Hair loss","Toothache","Sneezing"],a:0,level:"easy"},
  {q:"Which mosquito bites?",o:["Male","Female"],a:1,level:"easy"},

  {q:"HOSPITAL BOX: You landed at hospital.",o:["Continue"],a:0,level:"easy"},

  {q:"Breeding place?",o:["Flower pot","Pillow","Book","Shoe"],a:0,level:"medium"},
  {q:"Gas that attracts mosquitoes?",o:["Oxygen","Nitrogen","Carbon dioxide (CO₂)","Hydrogen"],a:2,level:"medium"},
  {q:"Why weekly cleaning?",o:["Saves water","Stops life cycle","For fun","No reason"],a:1,level:"medium"},
  {q:"If dengue is untreated?",o:["Nothing","Gets stronger","Can be fatal","Sleepy"],a:2,level:"medium"},
  {q:"High-risk season?",o:["Dry","Rainy","Winter","Snow"],a:1,level:"medium"},
  {q:"Prevention method?",o:["Eat candy","Use repellent","Sleep late","Ignore"],a:1,level:"medium"},
  {q:"Aedes appearance?",o:["Plain brown","Black with white stripes","Green","Transparent"],a:1,level:"medium"},
  {q:"Is bottle-cap water enough for breeding?",o:["Yes","No"],a:0,level:"medium"},
  {q:"What should you do with water containers?",o:["Cover them","Leave them open","Hide them","Ignore them"],a:0,level:"medium"},

  {q:"DENGUE FOGGING BOX: Fogging activity helps reduce adult mosquitoes.",o:["Continue"],a:0,level:"medium"},

  {q:"Why do Aedes prefer clean water?",o:["More predators","Safer for larvae","Hotter","Brighter"],a:1,level:"hard"},
  {q:"Why is dengue hard to control?",o:["Slow breeding","Fast breeding & hidden spots","Big size","Weak"],a:1,level:"hard"},
  {q:"Bottle trap works by?",o:["Heat","CO₂ attraction","Sound","Light"],a:1,level:"hard"},
  {q:"Why daytime biting?",o:["Body clock","Cold","Dark","Noise"],a:0,level:"hard"},
  {q:"Why is community needed?",o:["One person enough","Everyone affected","No reason","For fun"],a:1,level:"hard"},
  {q:"If dengue prevention is ignored?",o:["No change","More cases","Less mosquitoes","Safer"],a:1,level:"hard"},
  {q:"Urban dengue risk?",o:["Less water","More containers","Cold weather","Fewer people"],a:1,level:"hard"},
  {q:"Why fogging is not long-term?",o:["Kills all forever","Temporary only","Free","Strong"],a:1,level:"hard"},
  {q:"What happens when larvae are removed?",o:["Stops mosquitoes before adulthood","Mosquitoes grow faster","More eggs hatch","No effect"],a:0,level:"hard"},

  {q:"GO TO HOSPITAL BOX: Move to hospital and lose one turn.",o:["Continue"],a:0,level:"hard"},

  {q:"Why is dengue mainly human–mosquito–human cycle?",o:["Animals spread it faster","Virus only multiplies well in humans","Mosquitoes don’t bite animals","Humans don’t get infected"],a:1,level:"extreme"},
  {q:"Why can Aedes survive better in urban areas?",o:["Less food","More natural predators","More artificial containers with water","Cooler weather"],a:2,level:"extreme"},
  {q:"Main limitation of fogging?",o:["Too expensive","Kills only adult mosquitoes temporarily","Attracts more mosquitoes","Doesn’t produce smoke"],a:1,level:"extreme"},
  {q:"Why eliminate larvae?",o:["Larvae are bigger","Stops mosquitoes before they reproduce","Larvae fly faster","Adults are harmless"],a:1,level:"extreme"},
  {q:"How does CO₂ help mosquitoes find humans?",o:["Changes color","Signal of breathing organisms","Makes noise","Produces heat"],a:1,level:"extreme"},
  {q:"Why community cooperation is essential?",o:["Mosquitoes stay in one house","One house cleaning enough","Mosquitoes travel between houses","Dengue is not serious"],a:2,level:"extreme"},
  {q:"Why do Aedes eggs survive dry conditions?",o:["They die immediately","They are waterproof and hatch later","They fly away","They become adults instantly"],a:1,level:"extreme"},
  {q:"Biggest challenge in behaviour change?",o:["Lack of water","People forget or are not consistent","Mosquitoes are too big","Weather is cold"],a:1,level:"extreme"},
  {q:"Best long-term dengue prevention?",o:["Only fogging","Destroy breeding places regularly","Ignore symptoms","Wait for rain"],a:1,level:"extreme"},
  {q:"Which action helps the whole community?",o:["Clean only your room","Remove breeding spots together","Keep containers open","Skip inspection"],a:1,level:"extreme"}
];

/* FULL TASK SYSTEM */
const TASKS = [
  {t:"You cleaned all stagnant water at home → +20 points",p:20},
  {t:"You joined a gotong-royong campaign → +25 points",p:25},
  {t:"You used mosquito repellent daily → +10 points",p:10},
  {t:"You educated your neighbours about Dengue Fever → +20 points",p:20},
  {t:"You covered all water containers → +15 points",p:15},
  {t:"You reported mosquito breeding to authorities → +25 points",p:25},
  {t:"You created awareness posters → +15 points",p:15},
  {t:"You checked your house weekly → +20 points",p:20},
  {t:"You installed mosquito nets → +10 points",p:10},
  {t:"Your area has zero Aedes cases this month → +30 points",p:30},

  {t:"You left water in flower pots → -15 points",p:-15},
  {t:"You ignored stagnant water → -20 points",p:-20},
  {t:"You did not clean your surroundings for 2 weeks → -25 points",p:-25},
  {t:"You got bitten by Aedes aegypti → -10 points",p:-10},
  {t:"Your house has mosquito larvae → -20 points",p:-20},
  {t:"You threw rubbish that collects water → -15 points",p:-15},
  {t:"You didn’t use protection → -10 points",p:-10},
  {t:"Your neighbourhood has many breeding spots → -25 points",p:-25},
  {t:"You skipped weekly inspection → -15 points",p:-15},
  {t:"You believed mosquitoes only bite at night → -10 points",p:-10},

  {t:"You got dengue → Go to Hospital, lose 1 turn and -30 points",p:-30,moveTo:9,skip:true},
  {t:"You visited hospital early → +10 points",p:10},
  {t:"Fogging activity in your area → All players +10 points",all:10},
  {t:"Heavy rain → Move back 2 spaces",move:-2},
  {t:"Dry weather → Move forward 2 spaces",move:2},
  {t:"Community clean-up day → Move forward 3 spaces and +15 points",move:3,p:15},
  {t:"Found hidden breeding spot → Move forward 2 spaces and +10 points",move:2,p:10},
  {t:"Mosquito outbreak nearby → All players -10 points",all:-10},
  {t:"You invented a mosquito trap → +25 points",p:25},
  {t:"Health campaign success → Move forward 4 spaces",move:4}
];

function getTimerByLevel(level){
  if(level==="easy") return 10;
  if(level==="medium") return 15;
  if(level==="hard") return 20;
  return 25;
}

function showTurn(){
  document.getElementById("turn").innerText = players[turn].name;
  document.getElementById("score").innerText = players[turn].score;
}

function rollDice(){
  if(isProcessing) return;

  let diceDisplay = document.getElementById("dice");
  let count = 0;

  let rolling = setInterval(()=>{
    diceDisplay.innerText = Math.floor(Math.random()*6)+1;
    count++;

    if(count > 10){
      clearInterval(rolling);
      let final = Math.floor(Math.random()*6)+1;
      diceDisplay.innerText = final;
      movePlayer(final);
    }
  },100);
}

function movePlayer(steps){
  isProcessing = true;
  let player = players[turn];
  let moved = 0;

  let moving = setInterval(()=>{
    if(moved >= steps){
      clearInterval(moving);
      isProcessing = false;
      handleSpecialBox(player);
      loadQuestion(player);
      return;
    }

    player.pos = (player.pos + 1) % 40;
    moveToken(turn);
    highlightBox(player.pos);
    moved++;
  },220);
}

function handleSpecialBox(player){
  if(player.pos === 9){
    player.skip = true;
    document.getElementById("taskBox").innerText = "🏥 Hospital: lose 1 turn.";
  }

  if(player.pos === 19){
    players.forEach(p=>p.score += 10);
    document.getElementById("taskBox").innerText = "💨 Dengue Fogging: all players +10 points.";
  }

  if(player.pos === 29){
    player.pos = 9;
    player.skip = true;
    moveToken(turn);
    highlightBox(player.pos);
    document.getElementById("taskBox").innerText = "🚑 Go to Hospital: moved to Hospital and lose 1 turn.";
  }
}

function loadQuestion(player){
  currentQ = Q[player.pos];

  document.getElementById("question").innerText = currentQ.q;

  let options = document.getElementById("options");
  options.innerHTML = "";

  currentQ.o.forEach((opt,i)=>{
    let btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = ()=>checkAnswer(i, player);
    options.appendChild(btn);
  });

  startTimer(getTimerByLevel(currentQ.level));
}

function startTimer(t){
  clearInterval(timer);
  document.getElementById("time").innerText = t;

  timer = setInterval(()=>{
    if(isProcessing) return;

    t--;
    document.getElementById("time").innerText = t;

    if(t <= 0){
      clearInterval(timer);
      handleWrong(players[turn]);
    }
  },1000);
}

function checkAnswer(choice, player){
  if(isProcessing) return;
  isProcessing = true;
  clearInterval(timer);

  if(choice === currentQ.a){
    player.score += 10;
    document.getElementById("taskBox").innerText = "✅ Correct! +10 points";
  } else {
    applyTask(player);
  }

  document.getElementById("score").innerText = player.score;

  setTimeout(()=>{
    isProcessing = false;
    if(checkWin()) return;
    nextTurn();
  },700);
}

function handleWrong(player){
  if(isProcessing) return;
  isProcessing = true;

  applyTask(player);

  setTimeout(()=>{
    isProcessing = false;
    if(checkWin()) return;
    nextTurn();
  },700);
}

function applyTask(player){
  let task = TASKS[Math.floor(Math.random()*TASKS.length)];
  document.getElementById("taskBox").innerText = "TASK: " + task.t;

  if(task.p) player.score += task.p;

  if(task.all){
    players.forEach(p=>p.score += task.all);
  }

  if(task.move){
    player.pos = (player.pos + task.move + 40) % 40;
    moveToken(turn);
    highlightBox(player.pos);
  }

  if(task.moveTo !== undefined){
    player.pos = task.moveTo;
    moveToken(turn);
    highlightBox(player.pos);
  }

  if(task.skip){
    player.skip = true;
  }

  document.getElementById("score").innerText = player.score;
}

function nextTurn(){
  turn = (turn + 1) % players.length;

  if(players[turn].skip){
    players[turn].skip = false;
    document.getElementById("taskBox").innerText = players[turn].name + " skipped one turn!";
    turn = (turn + 1) % players.length;
  }

  showTurn();
}

function checkWin(){
  for(let p of players){
    if(p.score >= 300){
      document.getElementById("win").style.display = "flex";
      document.getElementById("winner").innerText = p.name + " wins with " + p.score + " points!";
      return true;
    }
  }
  return false;
}

showTurn();
</script>

</body>
</html>

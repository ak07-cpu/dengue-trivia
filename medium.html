<!DOCTYPE html>
<html>
<head>
  <title>Medium Level</title>
  <style>
    body { text-align:center; font-family:Arial; background:#fff3cd; }
    button { padding:10px; margin:10px; }
  </style>
</head>
<body>

<h1>🟡 Medium Level</h1>
<p id="task">Click Next</p>

<button onclick="nextTask()">Next Task</button>

<script>
const tasks = [
"Explain what stagnant water means (in 5 seconds)",
"Act out the life cycle (egg → larva → pupa → adult)",
"Name one disease besides dengue spread by Aedes",
"Show how you would check your house for water",
"Say why weekly cleaning is important",
"Describe the look of Aedes aegypti",
"Pretend you are giving advice to your friend about dengue",
"Act like a mosquito trying to bite someone",
"Name one outdoor place where mosquitoes breed",
"Say one community activity to prevent dengue"
];

function nextTask(){
  const r = Math.floor(Math.random()*tasks.length);
  document.getElementById("task").innerText = tasks[r];
}
</script>

</body>
</html>
